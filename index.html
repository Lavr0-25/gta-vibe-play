  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px;

    font: 700 15px system-ui; }
  #bar .sub { color: #8f8f9f; font: 500 13px system-ui; }

<iframe id="gamefr" src="play.html" title="Vibe Racer 2" allow="fullscreen; autoplay"></iframe>
<script>
// клавиатура должна идти в игру: iframe ловит фокус после загрузки и кликов
const fr = document.getElementById("gamefr");
fr.addEventListener("load", () => fr.contentWindow.focus());
document.addEventListener("click", () => fr.contentWindow.focus());
</script>
